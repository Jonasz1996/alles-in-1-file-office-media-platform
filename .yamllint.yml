extends: default
ignore: |
  web/node_modules/
  api/.venv/
  infra/ansible/roles/*/templates/
  infra/k8s/platform/templates/
rules:
  braces:
    max-spaces-inside: 1
  line-length:
    max: 160
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: whatever
