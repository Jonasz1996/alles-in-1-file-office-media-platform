# De web-app als losse image (P1). Dezelfde regels als api/app/main.py:
# - voorgecomprimeerd uit de build (.gz via gzip_static; brotli kent deze nginx niet);
# - /assets onveranderlijk, de rest no-cache (met ETag, dus 304 als er niets veranderde);
# - /sw.js en /boot.js nooit uit de HTTP-cache zonder te vragen, als text/javascript;
# - een ontbrekend bestand onder /assets of met een extensie is 404, nooit index.html (een oud
#   chunk na een nieuwe versie moet hard falen);
# - dezelfde CSP en beveiligingsheaders.
# add_header in een location vervangt alle add_header van daarboven: daarom staan ze in elke
# location opnieuw, met "always" zodat ook een 404 ze krijgt.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    etag on;
    gzip_static on;
    gzip_vary on;

    location ^~ /assets/ {
        types {
            text/javascript js mjs;
            text/css css;
            application/json json;
            image/svg+xml svg;
            image/png png;
            image/webp webp;
            font/woff2 woff2;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location = /sw.js {
        types {
            text/javascript js;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location = /boot.js {
        types {
            text/javascript js;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Bestanden met een extensie (index.html, het manifest, iconen, favicon): of ze bestaan, of 404
    location ~ \.[A-Za-z0-9]+$ {
        types {
            text/html html;
            text/javascript js;
            application/json json;
            application/manifest+json webmanifest;
            image/svg+xml svg;
            image/png png;
            image/x-icon ico;
            text/plain txt;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # De rest is een pagina van de app (client-side routing): index.html
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
