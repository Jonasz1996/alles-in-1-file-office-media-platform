# e2e-tests (P0, frozen na P0). Vanuit api/: uv run --with playwright pytest ../e2e
[pytest]
markers =
    perf: prestatiemeting (e2e/perf); traag, overslaan met -m "not perf"
    slow: een trage functionele test (pakketten mogen hem gebruiken)
    p1: e2e-test van pakket P1
    p2: e2e-test van pakket P2
    p3: e2e-test van pakket P3
    p4: e2e-test van pakket P4
    p5: e2e-test van pakket P5
    p6: e2e-test van pakket P6
    office: e2e van office met de nep-DS (fase 4; in elke CI-run, job e2e)
    office_real: e2e met de echte DS (fase 4; job office, met E2E_REAL_DS en E2E_REAL_DS_SECRET_FILE)
    media: e2e van media met de lokale worker en echte ffmpeg (fase 5; job e2e-media)
    media_perf: prestatiemeting van media (fase 5; job e2e-media-perf, alleen een rapport)
    provider_real: tegen de echte metadata-providers, met een sleutel (fase 5; nooit in CI)
# De meetscripts zijn ook testmodules (gemarkeerd met perf)
python_files = test_*.py first_view.py scroll.py
addopts = -p no:cacheprovider --strict-markers
