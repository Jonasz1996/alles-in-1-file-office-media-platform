apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.0.401
    helm:
      valuesObject:
        global:
          enableReplication: true
          replicationPlacement: "001"
          monitoring:
            enabled: true
        master:
          replicas: 3
          defaultReplication: "001"
          data:
            type: persistentVolumeClaim
            size: 1Gi
            storageClass: local-path
          logs:
            type: emptyDir
        volume:
          replicas: 3
          dataDirs:
            - name: data
              type: persistentVolumeClaim
              size: 560Gi
              storageClass: local-path
              maxVolumes: 0
        filer:
          replicas: 3
          data:
            type: persistentVolumeClaim
            size: 10Gi
            storageClass: local-path
          logs:
            type: emptyDir
          s3:
            enabled: true
            enableAuth: true
            existingConfigSecret: seaweedfs-s3-config
            createBuckets:
              - name: vault
              - name: media
              - name: thumbs
              - name: cache
              - name: backups
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
