# Eigen platformonderdelen (certificaat-uitgevers, database-cluster, ingresses,
# beveiliging). Alle installatiespecifieke waarden staan in infra/k8s/platform/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: https://github.com/Jonasz1996/alles-in-1-file-office-media-platform.git
    targetRevision: main
    path: infra/k8s/platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
