{{- $admin := list
  (dict "name" "argocd" "namespace" "argocd" "service" "argocd-server")
  (dict "name" "grafana" "namespace" "monitoring" "service" "kube-prometheus-stack-grafana") }}
{{- range $admin }}
{{- $host := include "platform.host" (dict "root" $ "name" .name) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.acme.issuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "platform.middlewares" (dict "root" $ "admin" true) }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ .name }}-tls
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: 80
{{- end }}
