# Grenzen voor de mediaworker (Keuze 11). install.sh neemt dit bestand alleen mee als
# `docker info --format '{{.MemoryLimit}} {{.CPUCfsQuota}}'` "true true" zegt, zoals bij office;
# anders start de container niet in een LXC zonder die cgroup-controllers.
# Het ontwerp schatte 3 transcodes samen op ±1,7 GB; Mh (docs/fase-5/metingen.md) mat de worker
# met al zijn ffmpeg op ten hoogste 793 MB (±200 MB per ffmpeg). 3 GB laat marge, ook voor de
# zwaardere treden op de LXC. cpus: 3 is cpu_budget op /beheer en houdt een core vrij voor de app
# (regel 14).
services:
  media:
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 3.0
