# Eerste versie op één node: het hele platform in één container. Wordt gestart door
# install.sh, dat ook .env maakt. Alleen de webpoort is van buiten bereikbaar.
name: platform

services:
  platform:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: platform:local
    restart: unless-stopped
    ports:
      - "${PORT:-80}:8080"
    environment:
      PLATFORM_NODE_NAME: ${NODE_NAME:-node1}
      PLATFORM_SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - ${DATA_ROOT:?}:/data
