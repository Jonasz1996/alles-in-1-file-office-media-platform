# Eerste versie op één node: het hele platform in één container. Wordt gestart door
# install.sh, dat ook .env maakt. Alleen poort 80 en 443 zijn van buiten bereikbaar;
# https start vanzelf zodra je op /beheer een domein instelt.
name: platform

services:
  platform:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: platform:local
    restart: unless-stopped
    # Elke open verbinding kost een file descriptor; Docker geeft standaard maar 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      PLATFORM_NODE_NAME: ${NODE_NAME:-node1}
      PLATFORM_SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # De grootste upload in bytes (fase 5, M10): standaard 50 GiB, voor een film
      PLATFORM_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-53687091200}
      # Plaatsnamen en landen bij foto's (fase 6, Keuze 29): aan of uit. install.sh haalt de
      # bronnen naar DATA_ROOT/geo; de app bouwt er bij de start places.sqlite van
      PLATFORM_PLACES: ${PLAATSEN:-aan}
    volumes:
      - ${DATA_ROOT:?}:/data
