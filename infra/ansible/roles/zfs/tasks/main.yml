- name: ZFS en sanoid installeren
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - sanoid
    state: present

- name: Controleren of de pool al bestaat
  ansible.builtin.command: zpool list -H -o name {{ zfs_pool }}
  register: zfs_pool_check
  changed_when: false
  failed_when: false

- name: Stoppen als de datadisk niet is ingevuld
  ansible.builtin.assert:
    that: "'VERVANG-MIJ' not in data_disk"
    fail_msg: Zet data_disk in de inventory op het juiste /dev/disk/by-id/-pad.
  when: zfs_pool_check.rc != 0

- name: ZFS-pool op de datadisk maken
  ansible.builtin.command: >
    zpool create -o ashift=12
    -O compression=lz4 -O atime=off -O xattr=sa -O acltype=posixacl
    -O mountpoint=/{{ zfs_pool }}
    {{ zfs_pool }} {{ data_disk }}
  when: zfs_pool_check.rc != 0
  changed_when: true

- name: Datasets maken
  community.general.zfs:
    name: "{{ zfs_pool }}/{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.props | default({}) }}"
  loop:
    - name: k3s            # persistent volumes (local-path): database, opslag, zoekindex
    - name: cache          # transcode-cache, regenereerbaar, geen snapshots
      props:
        "com.sun:auto-snapshot": "false"

- name: Configuratie voor sanoid
  ansible.builtin.template:
    src: sanoid.conf.j2
    dest: /etc/sanoid/sanoid.conf
    mode: "0644"

- name: Timer van sanoid aan
  ansible.builtin.systemd:
    name: sanoid.timer
    enabled: true
    state: started
