- name: Pakketten bijwerken
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Basispakketten installeren
  ansible.builtin.apt:
    name:
      - chrony
      - curl
      - jq
      - nfs-common
      - open-iscsi
      - ufw
      - unattended-upgrades
    state: present

- name: Automatische beveiligingsupdates aanzetten
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: SSH alleen met sleutels
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 3
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Herstart ssh

- name: Kernelinstellingen voor Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: 1
      fs.inotify.max_user_watches: 1048576
      fs.inotify.max_user_instances: 8192

- name: Firewall - SSH alleen vanaf het beheernetwerk
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ admin_cidr }}"

- name: Firewall - web (80/443) vanaf overal
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }   # HTTP/3

- name: Firewall - clusterverkeer alleen tussen de nodes
  community.general.ufw:
    rule: allow
    src: "{{ cluster_cidr }}"

- name: Firewall - pod- en servicenetwerk van k3s
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop:
    - 10.42.0.0/16
    - 10.43.0.0/16

- name: Firewall aan, standaard alles dicht
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
