# Standaardwaarden voor alle nodes. Overschrijf ze in inventory/hosts.yml of in
# group_vars/all.local.yml (staat niet in git).

# Netwerk
cluster_vip: 192.168.50.10          # VIP van de Kubernetes-API en het webverkeer (poort 80/443)
cluster_cidr: 192.168.50.0/24       # subnet van de 3 nodes
admin_cidr: 192.168.50.0/24         # vanaf hier mag SSH; nooit vanaf internet
vip_interface: eth0                 # netwerkkaart waarop kube-vip de VIP zet

# Datadisk (700 GB): wordt een ZFS-pool. LET OP: alles op deze disk wordt gewist.
data_disk: /dev/disk/by-id/VERVANG-MIJ
zfs_pool: tank

# k3s
k3s_version: v1.33.4+k3s1
kube_vip_version: v0.9.2
# Gedeeld geheim voor het cluster; maak het met: openssl rand -hex 32
# en zet het versleuteld in group_vars/all.local.yml (ansible-vault).
k3s_token: ""

# GitOps
gitops_repo_url: https://github.com/Jonasz1996/alles-in-1-file-office-media-platform.git
gitops_revision: main
argocd_chart_version: 8.3.5

# ZFS-snapshots via sanoid: elk uur, bewaar 24 uur, 7 dagen, 4 weken
sanoid_hourly: 24
sanoid_daily: 7
sanoid_weekly: 4
