<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nep-editor</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; }
      textarea { width: 100%; min-height: 8em; box-sizing: border-box; }
      #document p { margin: 0 0 4px; }
      #status { min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main id="id_main_view">
      <p id="status" role="status">Laden</p>
      <textarea id="text" aria-label="Nep-editor" disabled></textarea>
      <p>
        <button id="save" type="button" disabled>Opslaan</button>
        <button id="close" type="button" hidden>Sluiten</button>
      </p>
      <section aria-label="Document">
        <div id="document"></div>
        <div id="others"></div>
      </section>
    </main>
    <script src="editor.js"></script>
  </body>
</html>
