[project]
name = "platform-api"
version = "0.2.0"
description = "Kern-API van het alles-in-één file/office/media-platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pydantic[email]>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
