[project]
name = "platform-api"
version = "0.8.0"
description = "Kern-API van het alles-in-één file/office/media-platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pydantic[email]>=2.14.1",
    "cryptography>=46",
    "segno>=1.6",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pypdfium2>=5.14.0",
    "mutagen>=1.48.1",
]

[project.optional-dependencies]
# Alleen voor de container analyse (fase 6, Keuze 57). De Dockerfile zet ze in /opt/analyse,
# nooit in /opt/venv. De app importeert ze nooit (test_no_numpy_in_app.py). onnxruntime brengt
# protobuf, flatbuffers en packaging mee.
analyse = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fase 5: de tests met ffmpeg (media), de metingen (media_perf) en de echte providers
# (provider_real, alleen met de hand) draaien niet standaard; `-m media` kiest ze (§4.8)
markers = [
    "media: met de lokale mediaworker en echte ffmpeg (job api-media)",
    "media_perf: prestatiemeting van media; alleen een rapport",
    "provider_real: tegen de echte metadata-providers, met een sleutel; nooit in CI",
    "zoek_perf: prestatiemeting van zoeken (fase 6, job zoek-perf); niet in de gewone run",
    # Fase 6 (§4.1): zoek en triggers zet tests/search/conftest.py zelf; e2e/slim.sh kiest ze
    "zoek: zoeken en foto's (fase 6); draait gewoon mee",
    "triggers: de triggers en de migratie van zoeken (0010); draait gewoon mee",
    "ocr: met echte tesseract (job ocr); niet in de gewone run",
    # Z3 (Keuze 29): met de echte bronnen van plaatsen en landen (tools/geo/haal.py); de job api
    # haalt ze met sha256 en draait -m geo apart
    "geo: met de echte bronnen van plaatsnamen en landen; niet in de gewone run",
    # De container analyse (fase 6, §4.6; A0): analyse draait gewoon mee (de nep-worker, zonder
    # numpy); analyse_echt en beeld_echt zijn voor api/tests_analyse/ (X2a, X3a; job api-analyse)
    "analyse: de container analyse met de nep-worker (fase 6); draait gewoon mee",
    "analyse_echt: de echte worker van de analyse, met numpy (job api-analyse)",
    "beeld_echt: het echte beeldmodel (X3, job beeld-model)",
]
addopts = "--strict-markers -m 'not media and not media_perf and not provider_real and not zoek_perf and not ocr and not geo'"
