# De modellen van de container analyse (fase 6, Keuze 58; formaat van A0, app/analyse/lock.py).
# Eén regel per bestand: sha256 bytes naam url. Een veld dat met # begint, begint een opmerking.
# naam is een pad onder MODELLEN_ROOT; url is https://, of - voor een bestand dat de host zelf
# maakt (de omzetting van X3). install.sh haalt elk bestand, controleert de grootte en de
# sha256, en de worker rekent de sha256 na over de bytes die hij laadt. X3 voegt zijn regels toe.
