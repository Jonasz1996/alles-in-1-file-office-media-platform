name: Desktop-app

# Fase 11, stap 11-12: de desktop-app (apps/desktop, Tauri 2) bouwen voor Windows (.exe, een
# installatieprogramma van NSIS), Linux (.deb, amd64), Linux op arm64 (.deb, ook voor
# telefoons met Droidian) en macOS (.dmg, Intel en Apple-chip in één). Ze gaan in de release
# "clients"; het platform haalt ze daar zelf op voor de downloadpagina /apps.
on:
  push:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    name: Bouwen (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            out: platform-windows.exe
          - name: Linux
            os: ubuntu-22.04
            bundle: deb
            out: platform-linux.deb
          - name: Linux arm64 en Droidian
            os: ubuntu-22.04-arm
            bundle: deb
            out: platform-linux-arm64.deb
          - name: macOS
            os: macos-latest
            bundle: dmg
            target: universal-apple-darwin
            out: platform-macos.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pakketten voor Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bouwen
        run: npx --yes @tauri-apps/cli@2.12.6 build --bundles ${{ matrix.bundle }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Namen voor de downloadpagina
        run: |
          mkdir -p out
          dir=src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/${{ matrix.bundle }}
          cp "$dir"/*.${{ matrix.bundle == 'nsis' && 'exe' || matrix.bundle }} out/${{ matrix.out }}
      - name: In de release "clients" zetten (het platform haalt ze daar op)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view clients >/dev/null 2>&1 || gh release create clients --prerelease \
            --title "Client-apps" --notes "De gebouwde apps; het platform haalt ze zelf op voor /apps." \
            --target "${{ github.sha }}" || true
          gh release upload clients out/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: apps/desktop/out/*
          retention-days: 30
